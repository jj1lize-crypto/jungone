<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Preview — Background + Logo + Fireflies</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }

  .stage {
    position:fixed; inset:0;
    overflow:hidden;
    background:#000;
  }

  /* --- Background layer 1: night --- */
  .bg-night {
    position:absolute; inset:0; z-index:0;
    background:url("BGtv-night.png") center/cover no-repeat;
  }
  /* --- Background layer 2: guide (garden art) --- */
  .bg-guide {
    position:absolute; inset:0; z-index:1;
    background:url("garden%20guide1-re.png") top center/contain no-repeat;
    opacity:1;
  }
  /* --- Background layer 3: leaf overlay --- */
  .bg-leaf {
    position:absolute; inset:0; z-index:2;
    background:url("BGtv-leaf.png") center/cover no-repeat;
    opacity:0.55;
  }

  /* --- Logo --- */
  .header {
    position:absolute; top:0; left:0; right:0; z-index:20;
    text-align:center; padding:28px 20px 6px;
  }
  .logo {
    display:block; margin:0 auto;
    height:clamp(64px, 8.5vw, 110px); width:auto;
  }

  /* --- Fireflies --- */
  #fireflies { position:absolute; inset:0; z-index:15; pointer-events:none; }
  .firefly {
    position:absolute;
    border-radius:50%;
    background:rgba(255,240,160,0.95);
    opacity:0;
    animation:firefly-drift ease-in-out infinite, firefly-glow ease-in-out infinite;
  }
  @keyframes firefly-drift{
    0%   {transform:translate(0, 0);}
    20%  {transform:translate(40px, -25px);}
    40%  {transform:translate(-15px, -55px);}
    60%  {transform:translate(35px, -75px);}
    80%  {transform:translate(-25px, -40px);}
    100% {transform:translate(0, 0);}
  }
  @keyframes firefly-glow{
    0%,100%{opacity:0;}
    15%    {opacity:0.9;}
    50%    {opacity:0.4;}
    85%    {opacity:1;}
  }

  /* small label so you know it's the preview */
  .tag {
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    z-index:30; color:rgba(245,240,232,0.4);
    font-family:Georgia, serif; font-size:12px; letter-spacing:.1em;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="bg-night"></div>
    <div class="bg-guide"></div>
    <div class="bg-leaf"></div>

    <div id="fireflies"></div>

    <div class="header">
      <img id="logoImg" class="logo" src="cover-logo-wh.png" alt="JUNG ONE">
      <div id="logoText" style="display:none; font-family:Georgia,serif; color:#f5f0e8; font-size:clamp(28px,5vw,52px); letter-spacing:.12em;">JUNG&nbsp;ONE</div>
    </div>

    <div class="tag">preview · background + logo + fireflies</div>
  </div>

<script>
  // Logo: use the SAME relative path the real app uses (works on GitHub Pages)
  (function(){
    const img = document.getElementById("logoImg");
    const txt = document.getElementById("logoText");
    const tries = [
      "cover-logo-wh.png",                                                   // relative (same folder on GitHub Pages)
      "https://jj1lize-crypto.github.io/jungone/cover-logo-wh.png",          // absolute pages
      "https://raw.githubusercontent.com/jj1lize-crypto/jungone/main/cover-logo-wh.png"
    ];
    let i = 0;
    img.onerror = function(){
      i++;
      if(i < tries.length){ img.src = tries[i]; }
      else { img.style.display = "none"; txt.style.display = "block"; }
    };
    img.src = tries[0];
  })();

  // seeded random for stable placement
  function srand(n){ const x = Math.sin(n * 99.13) * 43758.5453; return x - Math.floor(x); }

  const layer = document.getElementById("fireflies");
  const COUNT = 90;   // lots of fireflies
  for(let i = 0; i < COUNT; i++){
    const f = document.createElement("div");
    f.className = "firefly";
    const rs = srand(i + 1);
    const size = 4 + (rs * rs) * 9;          // ~4-7px, some up to ~13px
    f.style.width = size + "px";
    f.style.height = size + "px";
    f.style.left = (srand(i + 100) * 100) + "%";
    f.style.top  = (srand(i + 200) * 100) + "%";
    // bright glow
    const g1 = size * 2, g2 = size * 4, g3 = size * 7;
    f.style.boxShadow =
      "0 0 " + g1 + "px rgba(255,240,160,1),"
      + "0 0 " + g2 + "px rgba(255,230,130,0.8),"
      + "0 0 " + g3 + "px rgba(255,215,110,0.5)";
    // varied timing
    const drift = 10 + srand(i + 300) * 12;   // 10s–22s drift
    const glow  = 2.5 + srand(i + 506) * 3;   // 2.5s–5.5s blink
    f.style.animationDuration = drift + "s, " + glow + "s";
    f.style.animationDelay = (-srand(i + 400) * drift) + "s, " + (-srand(i + 500) * glow) + "s";
    layer.appendChild(f);
  }
</script>
</body>
</html>
