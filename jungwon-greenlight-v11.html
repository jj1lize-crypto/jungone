<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>JungOne · 정원</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=DM+Mono:wght@300;400&display=swap');
@media(min-width:600px){.grid2{grid-template-columns:repeat(4,1fr)!important;}.sel-card{max-height:30vh!important;}.ph{padding:28px 32px 8px!important;}.pb{padding:8px 32px!important;}.pf{padding:10px 32px 24px!important;}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#f5f0e8;font-family:'Nanum Myeongjo',serif;overflow:hidden;}
.page{position:fixed;inset:0;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);background:#f5f0e8;}
.page.active{transform:translateX(0);}
.page.exit{transform:translateX(-100%);}
.ph{padding:36px 24px 8px;flex-shrink:0;}
.step{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#8a7e74;margin-bottom:8px;}
.prog{width:100%;height:2px;background:#e0d8cc;margin-bottom:14px;}
.prog-fill{height:100%;background:#0e0c09;transition:width .4s;}
.title{font-size:clamp(20px,5vw,28px);font-weight:700;line-height:1.18;color:#0e0c09;}
.sub{font-family:'DM Mono',monospace;font-size:11px;color:#8a7e74;margin-top:6px;line-height:1.6;}
.pb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 14px 8px;}
.pf{padding:12px 18px 40px;border-top:2px solid #e0d8cc;flex-shrink:0;}
.btn{width:100%;padding:16px;border:none;background:#0e0c09;color:#f5f0e8;font-family:'Nanum Myeongjo',serif;font-size:17px;font-weight:700;cursor:pointer;}
.btn:active{opacity:.75;}
.btn:disabled{opacity:.2;pointer-events:none;}
.btn-back{width:100%;padding:10px;border:none;background:transparent;color:#8a7e74;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;margin-top:8px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sel-card{position:relative;aspect-ratio:5/7;overflow:hidden;border-radius:4px;border:3px solid transparent;cursor:pointer;transition:transform .12s,border-color .15s;background:#e8e0d0;max-height:36vh;}
.sel-card:active{transform:scale(.92);}
.sel-card.on{border-color:#0e0c09;transform:scale(.96);}
.sel-card img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .18s;}
.grid2.picked .sel-card:not(.on) img{filter:brightness(.4);}
.chk{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;font-size:18px;color:#fff;z-index:5;}
.sel-card.on .chk{display:flex;}
.card-overlay{position:absolute;bottom:0;left:0;right:0;padding:10px 10px 12px;background:linear-gradient(transparent,rgba(0,0,0,.82));}
.card-name{font-family:'Nanum Myeongjo',serif;font-size:14px;font-weight:700;color:#fff;margin-bottom:3px;}
.card-desc{display:none;}
.q-num{position:absolute;top:8px;left:8px;font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.1em;color:rgba(255,255,255,.7);background:rgba(0,0,0,.4);padding:2px 6px;border-radius:2px;}
.q-detail{display:none;background:#fff;border:1px solid #e0d8cc;padding:16px;margin-top:10px;border-radius:4px;}
.q-detail.show{display:block;}
.q-detail-text{font-size:15px;color:#0e0c09;line-height:1.75;margin-bottom:6px;}
.q-detail-ex{font-family:'DM Mono',monospace;font-size:9px;color:#8a7e74;font-style:italic;margin-bottom:10px;line-height:1.6;}
.q-detail-follow{font-family:'DM Mono',monospace;font-size:10px;color:#6a5e54;line-height:1.7;padding-top:10px;border-top:1px solid #e0d8cc;}

/* Final card */
.final-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 12px;gap:10px;}
.card-box{width:min(200px,54vw);aspect-ratio:5/7;position:relative;border-radius:6px;overflow:hidden;}
.card-front{position:absolute;inset:0;z-index:1;background:#0e0c09;}
.card-front img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.img-t{z-index:1;}
.img-q{z-index:2;opacity:0.7;}
.img-a{z-index:3;opacity:0.85;}
.card-back{position:absolute;inset:0;background:#f5f0e8;border:2px solid #e0d8cc;display:flex;flex-direction:column;justify-content:space-between;padding:14px 14px;}
.back-badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;}
.back-badge{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1.5px solid #c8bfb0;color:#6a5e54;border-radius:2px;}
.back-q{font-size:clamp(11px,2.8vw,14px);color:#0e0c09;line-height:1.55;flex:1;display:flex;align-items:center;}
.back-ex{font-family:'DM Mono',monospace;font-size:8px;color:#8a7e74;font-style:italic;margin-top:4px;line-height:1.45;}
.back-follow{font-family:'DM Mono',monospace;font-size:9px;color:#6a5e54;line-height:1.55;padding-top:8px;border-top:1.5px solid #e0d8cc;margin-top:8px;}

/* Answer page */
.answer-wrap{flex:1;padding:16px 24px;display:flex;flex-direction:column;gap:14px;}
.answer-card-mini{display:flex;gap:10px;align-items:center;padding:12px;background:#fff;border:1px solid #e0d8cc;border-radius:4px;flex-shrink:0;}
.mini-img{width:44px;height:62px;object-fit:cover;border-radius:2px;flex-shrink:0;}
.mini-q{font-size:12px;color:#0e0c09;line-height:1.6;}
.mini-q span{font-family:'DM Mono',monospace;font-size:9px;color:#8a7e74;display:block;margin-bottom:3px;}
.name-input{width:100%;padding:12px 14px;border:1.5px solid #e0d8cc;background:#fff;font-family:'Nanum Myeongjo',serif;font-size:16px;color:#0e0c09;outline:none;border-radius:4px;}
.name-input:focus{border-color:#0e0c09;}
.answer-textarea{width:100%;padding:14px;border:1.5px solid #e0d8cc;background:#fff;font-family:'Nanum Myeongjo',serif;font-size:15px;color:#0e0c09;outline:none;resize:none;border-radius:4px;line-height:1.7;flex:1;min-height:120px;}
.answer-textarea:focus{border-color:#0e0c09;}
.answer-textarea::placeholder{color:#c8bfb0;}
.char-count{font-family:'DM Mono',monospace;font-size:9px;color:#c8bfb0;text-align:right;}

/* Garden page */
.garden-page{background:#0e0c09;}
.garden-header{padding:40px 24px 16px;flex-shrink:0;}
.garden-title{font-size:clamp(20px,5vw,28px);font-weight:400;color:#f5f0e8;opacity:.85;}
.garden-sub{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#4a4038;margin-top:6px;}
.garden-body{flex:1;position:relative;overflow:hidden;}
.seeds-container{position:absolute;inset:0;}

/* Seed bubbles */
.seed{position:absolute;transform:translate(-50%,-50%);cursor:pointer;transition:all .3s;}
.seed-img{width:72px;aspect-ratio:5/7;border-radius:4px;overflow:hidden;position:relative;box-shadow:0 4px 16px rgba(0,0,0,.4);}
.seed-img img{width:100%;height:100%;object-fit:cover;display:block;}
.seed-img img.sq{position:absolute;inset:0;opacity:.65;}
.seed-img img.sa{position:absolute;inset:0;opacity:.85;}
.seed-name{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.08em;text-transform:uppercase;color:#4a4038;text-align:center;margin-top:4px;}

/* Answer bubble */
.answer-bubble{position:absolute;z-index:50;pointer-events:none;opacity:0;transition:opacity .5s;max-width:220px;}
.answer-bubble.show{opacity:1;}
.bubble-inner{padding:12px 14px;border-radius:50% 40% 55% 45% / 45% 55% 40% 50%;font-family:'Nanum Myeongjo',serif;font-size:12px;line-height:1.65;color:#f5f0e8;border:1px solid rgba(255,255,255,.15);}
.bubble-inner .b-topic{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:rgba(245,240,232,.55);margin-bottom:4px;}
.bubble-inner .b-question{font-family:'Nanum Myeongjo',serif;font-size:12px;line-height:1.55;color:rgba(245,240,232,.95);font-style:italic;}
.bubble-inner .b-date{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.12em;color:rgba(245,240,232,.4);margin-top:6px;}
.bubble-inner .b-answer{font-family:'Nanum Myeongjo',serif;font-size:11px;line-height:1.6;color:rgba(245,240,232,.85);margin-top:8px;padding-top:8px;border-top:1px solid rgba(245,240,232,.12);}
.bubble-name{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.12em;text-transform:uppercase;margin-top:6px;opacity:.5;}

.garden-footer{padding:12px 18px 36px;flex-shrink:0;border-top:1px solid #1e1a14;}
.btn-light{width:100%;padding:14px;border:1px solid #3a3028;background:transparent;color:#d4c9b0;font-family:'Nanum Myeongjo',serif;font-size:15px;font-weight:400;cursor:pointer;}
.btn-light:active{background:#1e1a14;}

/* v11 — secondary button, text question cards, modal */
.btn-secondary{background:#fff !important;color:#0e0c09 !important;border:1.5px solid #0e0c09 !important;}
.btn-secondary:active{background:#f5f0e8 !important;}

/* v12 — hide text content on selection cards (image-only) */
.sel-card .card-overlay{display:none;}
.sel-card.q-text{aspect-ratio:5/7;background:#0e0c09;position:relative;border-radius:4px;cursor:pointer;overflow:hidden;}
.sel-card.q-text img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.sel-card.q-text .chk{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:#0e0c09;color:#fff;display:none;align-items:center;justify-content:center;font-size:12px;z-index:5;}
.sel-card.q-text.on{outline:2.5px solid #0e0c09;outline-offset:-2.5px;}
.sel-card.q-text.on .chk{display:flex;}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(14,12,9,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;padding:24px;}
.modal-backdrop.show{display:flex;}
.modal-card{background:#fff;padding:28px 24px 22px;width:100%;max-width:340px;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.3);text-align:center;}
.modal-title{font-family:'Nanum Myeongjo',serif;font-size:18px;color:#0e0c09;margin-bottom:8px;line-height:1.4;}
.modal-sub{font-family:'DM Mono',monospace;font-size:10px;color:#8a7e74;letter-spacing:.04em;line-height:1.6;margin-bottom:20px;}
.modal-buttons{display:flex;flex-direction:column;gap:8px;}
.modal-buttons .btn{padding:14px;font-size:14px;}

/* Card flash — shown briefly after action selection before auto-save */
.card-flash{position:fixed;inset:0;background:rgba(14,12,9,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:1100;display:none;align-items:center;justify-content:center;flex-direction:column;padding:32px;gap:24px;}
.card-flash.show{display:flex;animation:flashIn .4s ease;}
.card-flash-card{width:min(220px,60vw);aspect-ratio:5/7;position:relative;border-radius:6px;overflow:hidden;background:#0e0c09;animation:cardPop .6s cubic-bezier(.34,1.56,.64,1);}
.card-flash-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.card-flash-card .img-q{opacity:0.7;}
.card-flash-card .img-a{opacity:0.85;}
.flash-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#8a7e74;opacity:0;animation:fadeUp .5s ease .8s forwards;}
@keyframes flashIn{from{opacity:0;}to{opacity:1;}}
@keyframes cardPop{0%{transform:scale(.7);opacity:0;}60%{transform:scale(1.04);opacity:1;}100%{transform:scale(1);opacity:1;}}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- P1: Topic -->
<div class="page active" id="p1">
  <div class="ph">
    <div class="step">JungOne · 1 / 3</div>
    <div class="prog"><div class="prog-fill" style="width:33%"></div></div>
    <div class="title">주제를<br>골라줘</div>
  </div>
  <div class="pb"><div class="grid2" id="tGrid"></div></div>
  <div class="pf"><button class="btn" id="btn1" onclick="goTo('p2')" disabled>다음 →</button></div>
</div>

<!-- P2: Question -->
<div class="page" id="p2">
  <div class="ph">
    <div class="step">JungOne · 2 / 3</div>
    <div class="prog"><div class="prog-fill" style="width:66%"></div></div>
    <div class="title">질문을<br>골라줘</div>
    <div class="sub" id="p2Sub" style="font-family:'DM Mono',monospace;font-size:10px;color:#8a7e74;margin-top:6px;letter-spacing:.04em;"></div>
  </div>
  <div class="pb">
    <div class="grid2" id="qGrid"></div>
  </div>
  <div class="pf">
    <button class="btn" id="btn2" onclick="goTo('p4')" disabled>오늘의 카드 보기 →</button>
    <button class="btn-back" onclick="goBack('p1')">← 뒤로</button>
  </div>
</div>

<!-- P3: Action (optional, entered from P4) -->
<div class="page" id="p3">
  <div class="ph">
    <div class="step">JungOne · 액션</div>
    <div class="prog"><div class="prog-fill" style="width:100%"></div></div>
    <div class="title">어떤 마음을<br>전할까</div>
    <div class="sub" style="font-family:'DM Mono',monospace;font-size:10px;color:#8a7e74;margin-top:6px;line-height:1.7;">질문이 대화의 문을 연다면<br>액션은 그 대화의 결을 정해.</div>
  </div>
  <div class="pb"><div class="grid2" id="aGrid"></div></div>
  <div class="pf">
    <button class="btn" id="btn3" onclick="afterAction()" disabled>다음 →</button>
    <button class="btn-back" onclick="goBack('p4')">← 뒤로</button>
  </div>
</div>

<!-- P4: Final card -->
<div class="page" id="p4">
  <div class="ph" style="padding-bottom:10px;">
    <div class="step">JungOne · 오늘의 카드</div>
    <div class="prog"><div class="prog-fill" style="width:100%"></div></div>
    <div class="title">오늘의<br>카드</div>
  </div>
  <div class="final-stage">
    <div class="card-box">
      <div class="card-front" id="cFront">
        <img class="img-t" id="imgT" src="" alt=""/>
        <img class="img-q" id="imgQ" src="" alt=""/>
        <img class="img-a" id="imgA" src="" alt="" style="display:none;"/>
      </div>
    </div>
    <div class="card-box">
      <div class="card-back" id="cBack">
        <div>
          <div class="back-badges" id="bBadges"></div>
          <div class="back-q" id="bQ"></div>
        </div>
        <div>
          <div class="back-follow" id="bF" style="display:none;"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="pf" style="display:flex;flex-direction:column;gap:8px;">
    <button class="btn" onclick="goTo('p3')">액션카드 선택 →</button>
    <button class="btn btn-secondary" onclick="askAnswerConfirm()">정원으로 저장 →</button>
    <button class="btn-back" onclick="goBack('p2')">← 뒤로</button>
  </div>
</div>

<!-- P5: Answer -->
<div class="page" id="p5">
  <div class="ph">
    <div class="step">JungOne · 답변</div>
    <div class="prog"><div class="prog-fill" style="width:100%"></div></div>
    <div class="title">답변을<br>남겨줘</div>
  </div>
  <div class="answer-wrap">
    <div class="answer-card-mini" id="miniCard">
      <img class="mini-img" id="miniImg" src="" alt=""/>
      <div class="mini-q"><span id="miniLabel"></span><span id="miniQ"></span></div>
    </div>
    <textarea class="answer-textarea" id="answerText" placeholder="먼저 나에게 답해본 다음, 물어봐." maxlength="120" oninput="updateCount()"></textarea>
    <div class="char-count"><span id="charCount">0</span> / 120</div>
  </div>
  <div class="pf">
    <button class="btn" id="btn5" onclick="submitAnswer()" disabled>정원에 심기 →</button>
    <button class="btn-back" onclick="goBack('p4')">← 뒤로</button>
  </div>
</div>


<!-- P55: Seed planted -->
<div class="page" id="p55" style="background:#0e0c09;align-items:center;justify-content:center;text-align:center;">
  <div style="padding:40px 32px;display:flex;flex-direction:column;align-items:center;gap:24px;">
    <svg width="120" height="168" viewBox="0 0 120 168" xmlns="http://www.w3.org/2000/svg" id="seedSvg">
      <defs><radialGradient id="sg"><stop offset="0%" stop-color="#9aab9e" stop-opacity="0.18"/><stop offset="100%" stop-color="#0e0c09" stop-opacity="0"/></radialGradient></defs>
      <circle cx="60" cy="84" r="58" fill="url(#sg)"/>
      <circle cx="60" cy="128" r="4" fill="#9aab9e" opacity="0"><animate attributeName="opacity" from="0" to="0.7" dur="0.4s" begin="0.3s" fill="freeze"/></circle>
      <circle cx="60" cy="128" r="10" fill="none" stroke="#9aab9e" stroke-width="0.6" opacity="0"><animate attributeName="opacity" from="0" to="0.25" dur="0.4s" begin="0.3s" fill="freeze"/></circle>
      <line x1="60" y1="128" x2="60" y2="38" stroke="#9aab9e" stroke-width="1.2" opacity="0" stroke-dasharray="90" stroke-dashoffset="90">
        <animate attributeName="opacity" values="0;0.5" dur="0.2s" begin="0.6s" fill="freeze"/>
        <animate attributeName="stroke-dashoffset" from="90" to="0" dur="0.8s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </line>
      <path d="M 60 88 Q 38 78 35 62 Q 48 72 60 76" fill="#9aab9e" fill-opacity="0.1" stroke="#9aab9e" stroke-width="0.7" opacity="0"><animate attributeName="opacity" from="0" to="0.6" dur="0.4s" begin="1.3s" fill="freeze"/></path>
      <path d="M 60 68 Q 82 58 85 42 Q 72 52 60 56" fill="#9aab9e" fill-opacity="0.1" stroke="#9aab9e" stroke-width="0.7" opacity="0"><animate attributeName="opacity" from="0" to="0.6" dur="0.4s" begin="1.5s" fill="freeze"/></path>
      <circle cx="60" cy="32" r="10" fill="#9aab9e" fill-opacity="0.1" stroke="#9aab9e" stroke-width="0.7" opacity="0"><animate attributeName="opacity" from="0" to="0.5" dur="0.5s" begin="1.9s" fill="freeze"/></circle>
      <circle cx="60" cy="32" r="4" fill="#9aab9e" opacity="0"><animate attributeName="opacity" from="0" to="0.65" dur="0.5s" begin="1.9s" fill="freeze"/></circle>
    </svg>
    <div style="font-family:'Nanum Myeongjo',serif;font-size:22px;color:#f5f0e8;opacity:0.85;line-height:1.4;opacity:0;animation:fadeUp .6s ease 2s forwards;">정원에 흔적이<br>새로 더해졌어요.</div>
    <div style="font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#3a3028;opacity:0;animation:fadeUp .6s ease 2.3s forwards;">정원으로 이동 중 →</div>
  </div>
</div>

<!-- P6: Garden -->
<div class="page garden-page" id="p6">
  <div class="garden-header">
    <div class="garden-title">JungOne · 정원</div>
    <div class="garden-sub" id="gardenSub">오늘 심어진 씨앗</div>
  </div>
  <div class="garden-body">
    <div class="seeds-container" id="seedsContainer"></div>
    <div class="answer-bubble" id="answerBubble">
      <div class="bubble-inner" id="bubbleInner"></div>
      <div class="bubble-name" id="bubbleName"></div>
    </div>
  </div>
  <div class="garden-footer">
    <button class="btn-light" onclick="goTo('p1');resetAll()">또 하나 심으러 가기</button>
  </div>
</div>

<!-- Card flash — brief preview after action before auto-save -->
<div class="card-flash" id="cardFlash">
  <div class="card-flash-card">
    <img class="img-t" id="fImgT" src="" alt=""/>
    <img class="img-q" id="fImgQ" src="" alt=""/>
    <img class="img-a" id="fImgA" src="" alt=""/>
  </div>
  <div class="flash-label">정원에 심는 중…</div>
</div>

<!-- Modal: Ask if user wants to leave an answer -->
<div class="modal-backdrop" id="answerModal" onclick="closeAnswerModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-title">답변을 남기시겠습니까?</div>
    <div class="modal-sub">답변 없이 카드만 정원에 심을 수도 있어요.</div>
    <div class="modal-buttons">
      <button class="btn" onclick="answerYes()">예, 남길게요</button>
      <button class="btn btn-secondary" onclick="answerNo()">아니오, 바로 저장</button>
    </div>
  </div>
</div>

<script>
const BASE = "https://jj1lize-crypto.github.io/jungone/";

// 4 Topics
const TNAMES = {
  space:  "공간 & 상황",
  body:   "몸 & 변화",
  taste:  "맛 & 취향",

const DEMO = [

let S={topic:null,question:null,action:null};

/* ===== Build topic grid (P1) ===== */
function buildTopicGrid(){
  const grid = document.getElementById("tGrid");
  grid.innerHTML = "";
  Object.keys(TNAMES).forEach(key => {
    const card = document.createElement("div");
    card.className = "sel-card";
    card.onclick = () => pick("topic", key, card);
    card.innerHTML = `
      <div class="chk">✓</div>
      <img src="${TSRCS[key]}" alt="${TNAMES[key]}"/>
      <div class="card-overlay">
        <div class="card-name">${TNAMES[key]}</div>
        <div class="card-desc">${TDESC[key]}</div>
      </div>`;
    grid.appendChild(card);
  });
}

/* ===== Build question grid (P2) — 9 image cards of selected topic ===== */
function buildQuestionGrid(){
  const grid = document.getElementById("qGrid");
  grid.innerHTML = "";
  const topic = S.topic;
  if(!topic){ return; }
  document.getElementById("p2Sub").textContent = TNAMES[topic];
  const qs = QDATA[topic];
  qs.forEach((qText, i) => {
    const qid = `${topic}-${i+1}`;
    const qimgIdx = i % QSRCS.length;
    const card = document.createElement("div");
    card.className = "sel-card q-text";
    card.onclick = () => pick("question", qid, card);
    card.innerHTML = `
      <div class="chk">✓</div>
      <img src="${QSRCS[qimgIdx]}" alt=""/>`;
    grid.appendChild(card);
  });
}

/* ===== Build action grid (P3) ===== */
function buildActionGrid(){
  const grid = document.getElementById("aGrid");
  grid.innerHTML = "";
  Object.keys(ANAMES).forEach(key => {
    const card = document.createElement("div");
    card.className = "sel-card";
    card.onclick = () => pick("action", key, card);
    card.innerHTML = `
      <div class="chk">✓</div>
      <img src="${ASRCS[key]}" alt="${ANAMES[key]}"/>
      <div class="card-overlay">
        <div class="card-name">${ANAMES[key]}</div>
        <div class="card-desc">${ADESC[key]}</div>
      </div>`;
    grid.appendChild(card);
  });
}

function pick(type, val, el){
  const g = el.closest(".grid2");
  g.querySelectorAll(".sel-card").forEach(c => c.classList.remove("on"));
  el.classList.add("on");
  g.classList.add("picked");
  S[type] = val;
  const b = document.getElementById({topic:"btn1",question:"btn2",action:"btn3"}[type]);
  if(b) b.disabled = false;
}

function goTo(id){
  document.querySelectorAll(".page").forEach(p=>{
    if(p.classList.contains("active")){p.classList.remove("active");p.classList.add("exit");setTimeout(()=>p.classList.remove("exit"),420);}
  });
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
  if(id==="p2"){ buildQuestionGrid(); document.getElementById("btn2").disabled = true; S.question = null; }
  if(id==="p3"){ buildActionGrid(); document.getElementById("btn3").disabled = true; S.action = null; }
  if(id==="p4") buildFinalCard();
  if(id==="p5") buildAnswerPage();
  if(id==="p6") buildGarden();
}

function goBack(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}

function buildFinalCard(){
  const t = S.topic, q = S.question, a = S.action;
  const idx = parseInt(q.split('-')[1]) - 1;  // 0..8
  const qimgIdx = idx % QSRCS.length;  // wrap if needed
  document.getElementById("imgT").src = TSRCS[t];
  document.getElementById("imgQ").src = QSRCS[qimgIdx];

  // Show action layer only when chosen
  const imgA = document.getElementById("imgA");
  if(a){ imgA.src = ASRCS[a]; imgA.style.display = ""; }
  else { imgA.style.display = "none"; }

  // Badges & prompt
  const badges = ['<span class="back-badge">'+TNAMES[t]+'</span>',
                  '<span class="back-badge">'+String(idx+1).padStart(2,'0')+' / 09</span>'];
  if(a) badges.push('<span class="back-badge">'+ANAMES[a]+'</span>');
  document.getElementById("bBadges").innerHTML = badges.join('');
  document.getElementById("bQ").textContent = QDATA[t][idx];
  const bF = document.getElementById("bF");
  if(a){ bF.textContent = "→ " + ADESC[a]; bF.style.display = ""; }
  else { bF.style.display = "none"; }
}

/* ===== Action flow ===== */
function todayStr(){
  const d = new Date();
  return d.getFullYear() + "." + String(d.getMonth()+1).padStart(2,'0') + "." + String(d.getDate()).padStart(2,'0');
}

function afterAction(){
  // Action selected → show flash preview of front card, then auto-save to garden
  const t = S.topic, q = S.question, a = S.action;
  const idx = parseInt(q.split('-')[1]) - 1;
  const qimgIdx = idx % QSRCS.length;
  document.getElementById("fImgT").src = TSRCS[t];
  document.getElementById("fImgQ").src = QSRCS[qimgIdx];
  document.getElementById("fImgA").src = ASRCS[a];
  document.getElementById("cardFlash").classList.add("show");

  setTimeout(() => {
    document.getElementById("cardFlash").classList.remove("show");
    const col = TCOLORS[S.topic] || '#9aab9e';
    entries.push({name:"나", topic:S.topic, q:S.question, a:S.action, answer:"", date:todayStr(), color:col});
    goTo("p55");
    setTimeout(() => goTo("p6"), 2400);
  }, 2000);
}

/* ===== Save flow with answer-or-not modal ===== */
function askAnswerConfirm(){
  document.getElementById("answerModal").classList.add("show");
}
function closeAnswerModal(e){
  if(e && e.target.id !== "answerModal") return;
  document.getElementById("answerModal").classList.remove("show");
}
function answerYes(){
  document.getElementById("answerModal").classList.remove("show");
  goTo("p5");
}
function answerNo(){
  document.getElementById("answerModal").classList.remove("show");
  // Save without an answer
  const col = TCOLORS[S.topic] || '#9aab9e';
  entries.push({name:"나", topic:S.topic, q:S.question, a:S.action, answer:"", date:todayStr(), color:col});
  goTo("p55");
  setTimeout(()=> goTo("p6"), 2400);
}

/* ===== Answer page (P5) ===== */
function buildAnswerPage(){
  const t = S.topic, q = S.question;
  const idx = parseInt(q.split('-')[1]) - 1;
  const qimgIdx = idx % QSRCS.length;
  document.getElementById("miniImg").src = QSRCS[qimgIdx];
  document.getElementById("miniLabel").textContent = TNAMES[t] + " · " + String(idx+1).padStart(2,'0') + " / 09";
  document.getElementById("miniQ").textContent = QDATA[t][idx];
  document.getElementById("answerText").value = "";
  document.getElementById("charCount").textContent = "0";
  document.getElementById("btn5").disabled = true;
}

function updateCount(){
  const v = document.getElementById("answerText").value;
  document.getElementById("charCount").textContent = v.length;
  document.getElementById("btn5").disabled = v.trim().length < 3;
}

document.addEventListener("DOMContentLoaded", ()=>{
  buildTopicGrid();
});
// also run immediately in case DOMContentLoaded already fired
buildTopicGrid();

function submitAnswer(){
  const answer = document.getElementById("answerText").value.trim();
  const col = TCOLORS[S.topic] || '#9aab9e';
  entries.push({name:"나", topic:S.topic, q:S.question, a:S.action, answer, date:todayStr(), color:col});
  goTo("p55");
  setTimeout(()=> goTo("p6"), 2400);
}

// Garden
let bubbleTimer=null;
let bubbleIdx=0;

function buildGarden(){
  const container=document.getElementById("seedsContainer");
  container.innerHTML="";
  document.getElementById("gardenSub").textContent = entries.length + "개의 흔적이 자라고 있어";

  const W=window.innerWidth, H=window.innerHeight-180;
  const positions=getPositions(entries.length,W,H);

  entries.forEach((e,i)=>{
    const pos=positions[i];
    // q ID can be either old "q05" or new "space-3" format
    let qimgIdx = 0;
    if(e.q && e.q.includes('-')){
      qimgIdx = (parseInt(e.q.split('-')[1])-1) % QSRCS.length;
    } else if(e.q){
      qimgIdx = (parseInt(e.q.replace(/[^\d]/g,''))-1) % QSRCS.length;
    }
    const seed=document.createElement("div");
    seed.className="seed";
    seed.style.left=pos.x+"px";
    seed.style.top=pos.y+"px";
    seed.style.animationDelay=(i*0.12)+"s";
    const aHtml = e.a ? `<img class="sa" src="${ASRCS[e.a]}" alt=""/>` : '';
    seed.innerHTML=`
      <div class="seed-img">
        <img src="${TSRCS[e.topic]}" alt=""/>
        <img class="sq" src="${QSRCS[qimgIdx]}" alt=""/>
        ${aHtml}
      </div>
      <div class="seed-name">${e.name}</div>`;
    seed.onclick=()=>showBubble(e,pos,W);
    container.appendChild(seed);
  });

  // Auto cycle answers every 5s
  clearInterval(bubbleTimer);
  bubbleIdx=0;
  showBubbleAuto();
  bubbleTimer=setInterval(()=>{
    bubbleIdx=(bubbleIdx+1)%entries.length;
    showBubbleAuto();
  },5000);
}

function getPositions(n,W,H){
  const positions=[];
  const cols=Math.ceil(Math.sqrt(n*1.4));
  const rows=Math.ceil(n/cols);
  const cw=W/cols, ch=H/rows;
  for(let i=0;i<n;i++){
    const col=i%cols, row=Math.floor(i/cols);
    const jx=(Math.random()-.5)*cw*0.3;
    const jy=(Math.random()-.5)*ch*0.3;
    positions.push({x:cw*(col+.5)+jx, y:ch*(row+.5)+jy+40});
  }
  return positions;
}

function showBubbleAuto(){
  if(!entries.length) return;
  const e=entries[bubbleIdx];
  const seeds=document.querySelectorAll(".seed");
  if(!seeds[bubbleIdx]) return;
  const rect=seeds[bubbleIdx].getBoundingClientRect();
  const bodyRect=document.getElementById("p6").getBoundingClientRect();
  showBubbleAt(e, rect.left-bodyRect.left+rect.width/2, rect.top-bodyRect.top);
}

function showBubble(e,pos,W){
  showBubbleAt(e,pos.x,pos.y-50);
}

function showBubbleAt(e,x,y){
  if(window._curAudio){window._curAudio.pause();window._curAudio=null;}
  const bub=document.getElementById("answerBubble");
  const col=e.color||"#9aab9e";
  const inner=document.getElementById("bubbleInner");
  inner.style.background=col+"22";
  inner.style.borderColor=col+"44";
  document.getElementById("bubbleName").textContent=e.name;
  document.getElementById("bubbleName").style.color=col;

  // Build header: Topic · Question · Date
  const topicName = TNAMES[e.topic] || e.topic;
  let qText = "";
  if(e.q && e.q.includes('-')){
    const idx = parseInt(e.q.split('-')[1])-1;
    qText = QDATA[e.topic] ? QDATA[e.topic][idx] : "";
  }
  const dateStr = e.date || "";
  let headerHtml = `
    <div class="b-topic">${topicName}</div>
    <div class="b-question">"${qText}"</div>
    <div class="b-date">${dateStr}</div>`;

  // Body: optional media or answer
  let bodyHtml = "";
  if(e.video){
    bodyHtml = '<video src="'+e.video+'" style="width:100%;aspect-ratio:16/9;border-radius:6px;display:block;margin-top:8px;" autoplay muted loop playsinline></video>';
  } else if(e.photo){
    bodyHtml = '<img src="'+e.photo+'" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block;margin-top:8px;"/>';
  } else if(e.voice){
    var bars="";
    for(var i=0;i<28;i++){
      var h=8+Math.abs(Math.sin(i*0.7+1)*20+Math.cos(i*0.4)*14);
      bars+='<rect x="'+(i*6)+'" y="'+((30-h)/2)+'" width="4" height="'+h+'" rx="2" fill="'+col+'" opacity="0.75"/>';
    }
    bodyHtml = '<div style="margin-top:8px;"><svg width="168" height="30" viewBox="0 0 168 30">'+bars+'</svg><div style="font-family:monospace;font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:'+col+';opacity:.6;margin-top:3px;">▶ playing</div></div>';
    var audio=new Audio(e.voice);
    audio.play().catch(function(){});
    window._curAudio=audio;
  } else if(e.answer){
    bodyHtml = '<div class="b-answer">' + e.answer + '</div>';
  }

  inner.innerHTML = headerHtml + bodyHtml;

  var bw=210;
  var lx=x-bw/2;
  lx=Math.max(10,Math.min(lx,window.innerWidth-bw-10));
  bub.style.left=lx+"px";
  bub.style.top=Math.max(10,y-20)+"px";
  bub.classList.remove("show");
  requestAnimationFrame(function(){bub.classList.add("show");});
}

function resetAll(){
  S={topic:null,question:null,action:null};
  document.querySelectorAll(".sel-card").forEach(c=>c.classList.remove("on"));
  document.querySelectorAll(".grid2").forEach(g=>g.classList.remove("picked"));
  
  ["btn1","btn2","btn3"].forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=true;});
  clearInterval(bubbleTimer);
}
